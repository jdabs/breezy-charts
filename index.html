<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BreezyCharts</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.1.0/dist/lightweight-charts.standalone.production.js" integrity="sha384-ExNwjbclSLY2LS3S2c6aDJDjpBHGZLct23WX65fLzj0ob1bRrCh9H90WThES5wQA" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#0f1218; --panel:#161a22; --panel2:#1c212b; --line:#262c38; --text:#d6dae3; --muted:#7c8494;
    --accent:#3d8bfd; --up:#22ab94; --down:#f23645; --warn:#e3a33b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
  button,input,select{font:inherit;color:inherit}
  .app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 260px;height:100vh}
  header{grid-column:1/3;display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-weight:700;letter-spacing:.3px;margin-right:6px}
  .brand span{color:var(--accent)}
  .sym{width:130px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;text-transform:uppercase;font-weight:600}
  .sym:focus{outline:1px solid var(--accent)}
  .group{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .group button{background:none;border:0;padding:5px 9px;cursor:pointer;color:var(--muted)}
  .group button:hover{color:var(--text);background:#232937}
  .group button.on{color:var(--text);background:#2a3242}
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
  .btn:hover{border-color:#3a4252}
  .btn.on{border-color:var(--accent);color:#fff}
  select.btn{padding:5px 6px}
  .spacer{flex:1}
  .menu{position:relative}
  .menu .drop{display:none;position:absolute;top:110%;left:0;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;min-width:230px;max-height:80vh;overflow:auto;box-shadow:0 8px 24px #0008}
  .menu.open .drop{display:block}
  .drop label{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:5px;cursor:pointer}
  .drop label:hover{background:var(--panel2)}
  .drop .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
  .drop .sep{margin:6px 6px 2px;padding-top:6px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .drop .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .drop .mini{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 4px}
  .drop .mini:hover{color:var(--text)}
  .drop .warn{color:var(--warn)}
  .drop .new{width:100%;margin-top:4px;text-align:left}
  .drop .note{padding:5px 6px;color:var(--muted);font-size:12px}
  main{position:relative;min-width:0;min-height:0}
  .editor{display:none;position:absolute;left:10px;bottom:10px;z-index:7;color-scheme:dark;width:min(460px,calc(100% - 20px));max-height:calc(100% - 20px);flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 8px 24px #0008}
  .editor.show{display:flex}
  .editor .row{display:flex;gap:8px;align-items:center}
  .editor input[type=text],.editor input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
  .editor #edName{flex:1;font-weight:600}
  .editor textarea{flex:1 1 200px;min-height:140px;resize:vertical;background:#0c0f14;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;tab-size:2;white-space:pre;overflow:auto}
  .editor textarea:focus,.editor input:focus{outline:1px solid var(--accent)}
  .ed-msg{font-size:12px;color:var(--up);overflow-wrap:anywhere}
  .ed-msg.err{color:var(--down)}
  .ed-msg.off{color:var(--muted)}
  .ed-inputs{display:flex;flex-wrap:wrap;gap:6px 12px}
  .ed-inputs:empty{display:none}
  .ed-inputs label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
  .ed-inputs input{width:84px}
  .ed-ref{font-size:12px;color:var(--muted)}
  .ed-ref summary{cursor:pointer}
  .ed-ref .body{max-height:190px;overflow:auto;margin-top:6px}
  .ed-ref h4{margin:8px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .ed-ref p{margin:2px 0}
  .ed-ref code{color:var(--text);font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
  #chart{position:absolute;inset:0}
  .legend{position:absolute;left:10px;top:8px;z-index:5;pointer-events:none;font-size:12px;text-shadow:0 1px 2px #000}
  .legend .t{font-size:15px;font-weight:700;margin-right:8px}
  .legend .k{color:var(--muted);margin-left:8px}
  .legend .ind{margin-top:2px;color:var(--muted)}
  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:6;background:#0f121899;pointer-events:none}
  .overlay.show{display:flex}
  .overlay div{background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:8px;max-width:420px;text-align:center}
  aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  aside h3{margin:0;padding:10px 12px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .addrow{display:flex;gap:4px;padding:0 10px 8px}
  .addrow input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 7px;text-transform:uppercase}
  .wl{overflow:auto;flex:1}
  .wl .row{display:grid;grid-template-columns:1fr auto auto 16px;gap:8px;align-items:center;padding:7px 12px;cursor:pointer;border-top:1px solid #1d222c}
  .wl .row:hover{background:var(--panel2)}
  .wl .row.active{background:#1f2633;box-shadow:inset 2px 0 var(--accent)}
  .wl .s{font-weight:600}
  .wl .p{font-variant-numeric:tabular-nums}
  .wl .c{font-variant-numeric:tabular-nums;font-size:12px;min-width:58px;text-align:right}
  .wl .x{color:var(--muted);opacity:0;border:0;background:none;cursor:pointer;padding:0}
  .wl .row:hover .x{opacity:1}
  .up{color:var(--up)} .down{color:var(--down)}
  footer{grid-column:1/3;display:flex;gap:14px;align-items:center;padding:4px 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:12px}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--muted);margin-right:5px}
  .dot.ok{background:var(--up)} .dot.err{background:var(--down)} .dot.busy{background:var(--warn)}
  .modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(460px,92vw)}
  .card h2{margin:0 0 12px;font-size:16px}
  .card label{display:block;margin:12px 0 4px;color:var(--muted);font-size:12px}
  .card input,.card select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
  .card p{color:var(--muted);font-size:12px;margin:6px 0 0}
  .card a{color:var(--accent)}
  .card .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  @media (max-width:760px){
    .app{grid-template-columns:1fr;grid-template-rows:auto 1fr 190px auto}
    aside{border-left:0;border-top:1px solid var(--line)}
    header,footer{grid-column:1}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Breezy<span>Charts</span></div>
    <input id="symInput" class="sym" spellcheck="false" autocomplete="off" title="Type a symbol and press Enter">
    <div id="tfGroup" class="group"></div>
    <select id="chartType" class="btn" title="Chart type">
      <option value="candles">Candles</option>
      <option value="heikin">Heikin Ashi</option>
      <option value="bars">Bars</option>
      <option value="line">Line</option>
      <option value="area">Area</option>
    </select>
    <div class="menu" id="indMenu">
      <button class="btn" id="indBtn">Indicators ▾</button>
      <div class="drop" id="indDrop"></div>
    </div>
    <button class="btn" id="hlineBtn" title="Click the chart to place a horizontal line">― H-Line</button>
    <button class="btn" id="clearLinesBtn" title="Remove lines on this symbol">Clear lines</button>
    <div class="spacer"></div>
    <select id="providerSel" class="btn" title="Data source"></select>
    <button class="btn" id="settingsBtn" title="Settings">⚙</button>
  </header>

  <main>
    <div id="chart"></div>
    <div class="legend" id="legend"></div>
    <div class="overlay" id="overlay"><div id="overlayMsg"></div></div>
    <div class="editor" id="editor">
      <div class="row">
        <input type="text" id="edName" maxlength="40" placeholder="Script name" spellcheck="false" autocomplete="off" aria-label="Script name">
        <label class="row" title="Draw this script on the chart"><input type="checkbox" id="edOn"> Show</label>
        <button class="btn" id="edClose" title="Close editor">✕</button>
      </div>
      <textarea id="edSrc" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Script"></textarea>
      <div class="ed-msg" id="edMsg"></div>
      <div class="ed-inputs" id="edInputs"></div>
      <details class="ed-ref"><summary>Reference</summary><div class="body" id="edRef"></div></details>
      <div class="row"><button class="btn" id="edDelete">Delete script</button></div>
    </div>
  </main>

  <aside>
    <h3>Watchlist <span id="wlNote" style="text-transform:none;letter-spacing:0"></span></h3>
    <div class="addrow"><input id="wlAdd" placeholder="Add symbol…" spellcheck="false"><button class="btn" id="wlAddBtn">+</button></div>
    <div class="wl" id="wl"></div>
  </aside>

  <footer>
    <span><span class="dot" id="statusDot"></span><span id="statusText">Ready</span></span>
    <span id="delayNote"></span>
    <span id="tdDay" style="display:none"></span>
    <span class="spacer" style="flex:1"></span>
    <span id="updated"></span>
    <span>Charts by <a href="https://www.tradingview.com/" style="color:var(--muted)">TradingView</a> Lightweight Charts™</span>
  </footer>
</div>

<div class="modal" id="settings">
  <div class="card">
    <h2>Settings</h2>
    <label for="tdKey">Twelve Data API key (stocks, ETFs, forex)</label>
    <input id="tdKey" placeholder="paste your free key" spellcheck="false" autocomplete="off">
    <p>Free key at <a href="https://twelvedata.com/register" target="_blank" rel="noopener">twelvedata.com/register</a> — no card needed. Free plan: 8 requests/min, 800/day, US markets, personal (non-display) use only. Your key stays in this browser.</p>
    <label for="refreshSel">Auto-refresh</label>
    <select id="refreshSel">
      <option value="auto">Automatic (fits each source's rate limit)</option>
      <option value="0">Off</option>
    </select>
    <div class="actions">
      <button class="btn" id="settingsCancel">Close</button>
      <button class="btn primary" id="settingsSave">Save</button>
    </div>
  </div>
</div>

<!-- The formula language for custom indicators. Self-contained: it defines window.Formula and nothing else. -->
<script id="formula">
/* BreezyCharts Formula: a small series-based language for chart indicators.

   A script is a list of lines, each either `name = expression` or a call such as plot(...).
   Every value is a number, a piece of text, or a series holding one value per bar, and
   arithmetic works on whole series at once. There are no loops and no access to the page,
   so a script always finishes and can do nothing except compute numbers and ask for plots.

   Usage:
     const program = Formula.compile(source);          // throws Formula.FormulaError
     const result  = program.run(bars, inputValues, { sessionKey });
     // bars: [{ time, open, high, low, close, volume }], oldest first
     // result: { plots: [{ title, color, width, style, pane, hline, values }], inputs: [...] }

   It is self-contained: this block defines window.Formula and touches nothing else on the page.
   (Under Node it sets module.exports instead; tests/formula.test.js loads it that way.)

   In this order:
     SETUP               limits, the error type, small helpers, the names the language knows
     TOKENIZER           source text to tokens
     PARSER              tokens to a tree, one statement per line
     SERIES MATHS        helpers shared by the operators and the built-in functions
     BUILT-IN FUNCTIONS  everything a script can call; this is also where the Reference text comes from
     EVALUATOR           runs a parsed script against bars
     PUBLIC API          compile(), and what the editor needs
*/
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(); else root.Formula = factory();
})(typeof self !== 'undefined' ? self : this, function () {
'use strict';

/* ============================================================================
   SETUP - things the rest of the language leans on
   ============================================================================ */

/* ---- limits ---- */
// Caps that keep any script small and quick. `work` is a budget of elementary steps for one run:
// functions call c.spend() as they go, and a script that would exceed it is stopped with an error.
const LIMITS = { source: 20000, statements: 400, nodes: 4000, depth: 60, length: 5000, plots: 32, inputs: 32, work: 2e8 };

/* ---- errors ---- */
// The only error a caller should see. `detail` is the message without the "Line N:" prefix.
class FormulaError extends Error {
  constructor(detail, line){ super(line ? `Line ${line}: ${detail}` : detail); this.name = 'FormulaError'; this.detail = detail; this.line = line || 0; }
}

/* ---- small helpers ---- */
// A series is a plain array with one value per bar. Missing values are NaN ("na" in a script),
// which is why the code tests `x !== x`: only NaN is unequal to itself.
// A series of text (colours chosen bar by bar) is an array flagged with `.str = true`.
const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const isS = Array.isArray;
const isStr = v => typeof v === 'string' || (isS(v) && v.str === true);
const truthy = x => x === x && x !== 0 && x !== null; // na counts as false
const fill = (n, v) => new Array(n).fill(v);

/* ---- names the language knows ---- */
const COLORS = { red:'#f23645', green:'#22ab94', blue:'#3d8bfd', orange:'#ff8a3d', yellow:'#f5c542', purple:'#b07cff', teal:'#2fb6c9', pink:'#ff6fb5', gray:'#7c8494', grey:'#7c8494', white:'#d6dae3' };
const PALETTE = ['#3d8bfd', '#ff8a3d', '#22ab94', '#b07cff', '#f5c542', '#2fb6c9', '#ff6fb5'];
const WORDS = ['line', 'histogram', 'area', 'dashed', 'dotted', 'dots', 'main', 'below'];
const SERIES_NAMES = ['open', 'high', 'low', 'close', 'volume', 'hl2', 'hlc3', 'ohlc4', 'tr', 'vwap', 'time', 'bar_index'];
const RESERVED = new Set(SERIES_NAMES.concat(['and', 'or', 'not', 'true', 'false', 'na']));

/* ============================================================================
   TOKENIZER - source text to tokens
   ============================================================================ */
// A token is { t, v, line }: t is "num", "id", "str", "nl" (end of a statement), "end", or the
// symbol itself. Newlines inside brackets are ignored, so a call can run over several lines.
function tokenize(src){
  const toks = [], two = ['==', '!=', '<=', '>=', '&&', '||'];
  let i = 0, line = 1, depth = 0;
  while (i < src.length) {
    const c = src[i];
    if (c === '\n') { if (!depth && toks.length && toks[toks.length-1].t !== 'nl') toks.push({ t:'nl', line }); line++; i++; continue; } // a line can continue inside brackets
    if (c === ' ' || c === '\t' || c === '\r') { i++; continue; }
    if (c === '/' && src[i+1] === '/') { while (i < src.length && src[i] !== '\n') i++; continue; }
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i+1] || ''))) {
      const m = /^(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?/.exec(src.slice(i, i + 40));
      toks.push({ t:'num', v:parseFloat(m[0]), line }); i += m[0].length; continue;
    }
    if (/[A-Za-z_]/.test(c)) { let j = i + 1; while (j < src.length && /[A-Za-z0-9_]/.test(src[j])) j++; toks.push({ t:'id', v:src.slice(i, j), line }); i = j; continue; }
    if (c === '"' || c === "'") {
      let j = i + 1; while (j < src.length && src[j] !== c && src[j] !== '\n') j++;
      if (src[j] !== c) throw new FormulaError('text is missing its closing quote', line);
      toks.push({ t:'str', v:src.slice(i + 1, j), line }); i = j + 1; continue;
    }
    const pair = src.substr(i, 2);
    if (two.includes(pair)) { toks.push({ t:pair, line }); i += 2; continue; }
    if ('()[],?:+-*/%<>=!'.includes(c)) {
      if (c === '(' || c === '[') depth++; else if ((c === ')' || c === ']') && depth) depth--;
      toks.push({ t:c, line }); i++; continue;
    }
    throw new FormulaError(`unexpected character "${c}"`, line);
  }
  toks.push({ t:'nl', line }); toks.push({ t:'end', line });
  return toks;
}

/* ============================================================================
   PARSER - tokens to a tree, one statement per line
   ============================================================================ */
// Recursive descent. Every node has a kind `k`: num, str, id, un, bin, tern, idx (x[n]) or call.
// The result is a list of { k:"assign", name, e } and { k:"expr", e } statements.
function parse(src){
  const toks = tokenize(src); let p = 0, depth = 0, nodes = 0;
  const peek = () => toks[p], next = () => toks[p++];
  const fail = (msg, t) => { throw new FormulaError(msg, (t || peek()).line); };
  const show = t => t.t === 'nl' || t.t === 'end' ? 'the end of the line' : t.t === 'num' ? String(t.v) : t.t === 'id' ? `"${t.v}"` : t.t === 'str' ? 'text' : `"${t.t}"`;
  const expect = (t, what) => { if (peek().t !== t) fail(`expected ${what || '"' + t + '"'} but found ${show(peek())}`); return next(); };
  const node = n => { if (++nodes > LIMITS.nodes) fail('script is too long'); return n; };
  const isWord = (t, w) => t.t === 'id' && t.v === w;
  const deeper = f => { if (++depth > LIMITS.depth) fail('too many nested brackets'); const r = f(); depth--; return r; };

  /* ---- expressions, loosest-binding first: ?: , or, and, not, comparisons, + -, * / %, unary, x[n] ---- */
  const expr = () => deeper(ternary);
  function ternary(){
    const c = or(); if (peek().t !== '?') return c;
    const t = next(), a = expr(); expect(':', '":" to finish the ? choice'); const b = expr();
    return node({ k:'tern', c, a, b, line:t.line });
  }
  function or(){ let a = and(); while (peek().t === '||' || isWord(peek(), 'or')) { const t = next(); a = node({ k:'bin', op:'or', a, b:and(), line:t.line }); } return a; }
  function and(){ let a = not(); while (peek().t === '&&' || isWord(peek(), 'and')) { const t = next(); a = node({ k:'bin', op:'and', a, b:not(), line:t.line }); } return a; }
  function not(){ if (peek().t === '!' || isWord(peek(), 'not')) { const t = next(); return node({ k:'un', op:'not', a:deeper(not), line:t.line }); } return cmp(); }
  function cmp(){ let a = add(); while (['==', '!=', '<', '<=', '>', '>='].includes(peek().t)) { const t = next(); a = node({ k:'bin', op:t.t, a, b:add(), line:t.line }); } return a; }
  function add(){ let a = mul(); while (peek().t === '+' || peek().t === '-') { const t = next(); a = node({ k:'bin', op:t.t, a, b:mul(), line:t.line }); } return a; }
  function mul(){ let a = unary(); while (peek().t === '*' || peek().t === '/' || peek().t === '%') { const t = next(); a = node({ k:'bin', op:t.t, a, b:unary(), line:t.line }); } return a; }
  function unary(){
    if (peek().t === '-' || peek().t === '+') { const t = next(), a = deeper(unary); return t.t === '-' ? node({ k:'un', op:'neg', a, line:t.line }) : a; }
    return postfix();
  }
  function postfix(){
    let a = primary();
    while (peek().t === '[') { const t = next(), n = expr(); expect(']', '"]"'); a = node({ k:'idx', a, n, line:t.line }); }
    return a;
  }
  function primary(){
    const t = next();
    if (t.t === 'num') return node({ k:'num', v:t.v });
    if (t.t === 'str') return node({ k:'str', v:t.v });
    if (t.t === '(') { const e = expr(); expect(')', '")"'); return e; }
    if (t.t === 'id') return peek().t === '(' ? call(t) : node({ k:'id', name:t.v, line:t.line });
    return fail(`unexpected ${show(t)}`, t);
  }
  function call(t){
    next(); const args = [], named = {}; let sawNamed = false;
    if (peek().t !== ')') for (;;) {
      if (peek().t === 'id' && toks[p+1].t === '=') {
        const k = next().v; next();
        if (has(named, k)) fail(`"${k}" is given twice in ${t.v}()`);
        named[k] = expr(); sawNamed = true;
      } else { if (sawNamed) fail(`in ${t.v}(), put plain values before named ones`); args.push(expr()); }
      if (peek().t === ',') { next(); continue; }
      break;
    }
    expect(')', `")" to close ${t.v}(`);
    return node({ k:'call', name:t.v, args, named, line:t.line });
  }

  /* ---- statements ---- */
  const prog = [];
  while (peek().t !== 'end') {
    if (peek().t === 'nl') { next(); continue; }
    const t = peek();
    if (t.t === 'id' && toks[p+1].t === '=') {
      if (RESERVED.has(t.v)) fail(`"${t.v}" is built in and cannot be reassigned; pick another name`);
      next(); next(); prog.push({ k:'assign', name:t.v, e:expr(), line:t.line });
    } else prog.push({ k:'expr', e:expr(), line:t.line });
    if (peek().t !== 'nl') fail(`unexpected ${show(peek())}`);
    if (prog.length > LIMITS.statements) fail('script has too many lines');
  }
  return prog;
}

/* ============================================================================
   SERIES MATHS - helpers shared by the operators and the built-in functions
   ============================================================================ */

/* ---- operators, applied to numbers or whole series alike ---- */
const map1 = (a, f) => isS(a) ? a.map(f) : f(a);

  if (isS(a)) return isS(b) ? a.map((x, i) => f(x, b[i])) : a.map(x => f(x, b));

const cmpOp = f => (x, y) => x !== x || y !== y ? NaN : +f(x, y);

/* ---- windows and running averages ---- */

const winMean = (a, s, e) => winSum(a, s, e) / (e - s + 1);

/* ============================================================================
   BUILT-IN FUNCTIONS - everything a script can call
   ============================================================================ */

/* ---- registering a function ---- */
// def(group, name, params, doc, impl) adds a function. `group` and `doc` become its Reference entry.
// Each param is prm(name, type, { d: default }); a default makes it optional. The evaluator checks and
// converts arguments by type before calling impl(c, ...args):
//   series  a series (a single number is spread over every bar)     num     a number or a series
//   scalar  a single number                                         len     a whole number of bars, 1 or more
//   text    text in quotes                                          word    one of the bare words in `of`
//   color   a colour name or code, or a series of them

const SRC = prm('src', 'series'), LEN = prm('length', 'len');

  const sig = variadic ? `${name}(a, b, ...)` : `${name}(${params.map(q => 'd' in q ? `[${q.n}]` : q.n).join(', ')})`;
  FUNCS[name] = { name, params, impl, variadic: !!variadic, sig };
  REFERENCE.push({ group, sig, doc });

/* ---- averages ---- */
def('Averages', 'sma', [SRC, LEN], 'Simple moving average.', (c, src, len) => rolling(c, src, len, winMean));
def('Averages', 'ema', [SRC, LEN], 'Exponential moving average.', (c, src, len) => expAvg(c, src, len, 2 / (len + 1)));
def('Averages', 'rma', [SRC, LEN], "Wilder's smoothed average, as used inside RSI and ATR.", (c, src, len) => expAvg(c, src, len, 1 / len));
def('Averages', 'wma', [SRC, LEN], 'Weighted moving average; recent bars count more.', (c, src, len) =>
  rolling(c, src, len, (a, s, e) => { let t = 0, w = 0; for (let i = s; i <= e; i++) { const k = i - s + 1; t += a[i] * k; w += k; } return t / w; }));

/* ---- windows ---- */
def('Windows', 'sum', [SRC, LEN], 'Sum of the last `length` bars.', (c, src, len) => rolling(c, src, len, winSum));
def('Windows', 'highest', [SRC, LEN], 'Highest value in the last `length` bars.', (c, src, len) => rolling(c, src, len, (a, s, e) => { let m = a[s]; for (let i = s + 1; i <= e; i++) if (a[i] > m) m = a[i]; return m; }));
def('Windows', 'lowest', [SRC, LEN], 'Lowest value in the last `length` bars.', (c, src, len) => rolling(c, src, len, (a, s, e) => { let m = a[s]; for (let i = s + 1; i <= e; i++) if (a[i] < m) m = a[i]; return m; }));
def('Windows', 'stdev', [SRC, LEN], 'Standard deviation over the last `length` bars.', (c, src, len) =>
  rolling(c, src, len, (a, s, e) => { const m = winMean(a, s, e); let t = 0; for (let i = s; i <= e; i++) t += (a[i] - m) ** 2; return Math.sqrt(t / (e - s + 1)); }));
def('Windows', 'linreg', [SRC, LEN], 'End point of a straight line fitted to the last `length` bars.', (c, src, len) =>
  rolling(c, src, len, (a, s, e) => {
    const k = e - s + 1; if (k === 1) return a[e];
    let sx = 0, sy = 0, sxy = 0, sxx = 0;
    for (let i = s; i <= e; i++) { const x = i - s; sx += x; sy += a[i]; sxy += x * a[i]; sxx += x * x; }

    return (sy - slope * sx) / k + slope * (k - 1);

def('Windows', 'cum', [SRC], 'Running total since the first bar.', (c, src) => { let t = 0; return src.map(x => (t += x === x ? x : 0)); });

/* ---- momentum ---- */
def('Momentum', 'change', [SRC, prm('length', 'len', { d:1 })], 'Difference from `length` bars ago (1 if left out).', (c, src, len) => src.map((x, i) => i - len >= 0 ? x - src[i - len] : NaN));
def('Momentum', 'roc', [SRC, LEN], 'Percent change from `length` bars ago.', (c, src, len) => src.map((x, i) => i - len >= 0 && src[i - len] !== 0 ? 100 * (x - src[i - len]) / src[i - len] : NaN));
def('Momentum', 'rsi', [SRC, LEN], 'Relative strength index, 0 to 100.', (c, src, len) => {
  const ch = src.map((x, i) => i ? x - src[i-1] : NaN);
  const up = expAvg(c, ch.map(d => d !== d ? NaN : Math.max(d, 0)), len, 1 / len), dn = expAvg(c, ch.map(d => d !== d ? NaN : Math.max(-d, 0)), len, 1 / len);

/* ---- trend and volatility ---- */
// These two carry state from bar to bar, which a script cannot do itself, so they are built in.
def('Trend and volatility', 'atr', [LEN], 'Average true range.', (c, len) => expAvg(c, c.S('tr'), len, 1 / len));

/* ---- signals ---- */
const A = prm('a', 'series'), B = prm('b', 'series');
def('Signals', 'crossover', [A, B], 'True on the bar where `a` rises above `b`.', (c, a, b) => a.map((x, i) => +(i > 0 && x > b[i] && a[i-1] <= b[i-1])));
def('Signals', 'crossunder', [A, B], 'True on the bar where `a` falls below `b`.', (c, a, b) => a.map((x, i) => +(i > 0 && x < b[i] && a[i-1] >= b[i-1])));
def('Signals', 'cross', [A, B], 'True on the bar where `a` and `b` cross either way.', (c, a, b) => a.map((x, i) => +(i > 0 && ((x > b[i] && a[i-1] <= b[i-1]) || (x < b[i] && a[i-1] >= b[i-1])))));
def('Signals', 'barssince', [prm('cond', 'series')], 'Bars since `cond` was last true.', (c, cond) => { let k = NaN; return cond.map(x => (k = truthy(x) ? 0 : k + 1)); });
def('Signals', 'valuewhen', [prm('cond', 'series'), SRC], 'Value of `src` the last time `cond` was true.', (c, cond, src) => { let v = NaN; return cond.map((x, i) => (v = truthy(x) ? src[i] : v)); });

/* ---- maths ---- */
const X = prm('x', 'num');
[['abs', 'Absolute value.', Math.abs], ['sqrt', 'Square root.', x => x < 0 ? NaN : Math.sqrt(x)], ['log', 'Natural logarithm.', x => x <= 0 ? NaN : Math.log(x)], ['exp', 'e to the power x.', Math.exp],

  .forEach(([name, doc, f]) => def('Maths', name, [X], doc, (c, x) => map1(x, v => f(v))));
def('Maths', 'pow', [prm('base', 'num'), prm('exponent', 'num')], 'Base raised to a power.', (c, a, b) => map2(a, b, (x, y) => Math.pow(x, y)));
def('Maths', 'max', [], 'Largest of the values, bar by bar.', (c, ...v) => v.reduce((a, b) => map2(a, b, (x, y) => x !== x || y !== y ? NaN : Math.max(x, y))), true);
def('Maths', 'min', [], 'Smallest of the values, bar by bar.', (c, ...v) => v.reduce((a, b) => map2(a, b, (x, y) => x !== x || y !== y ? NaN : Math.min(x, y))), true);
def('Maths', 'avg', [], 'Average of the values, bar by bar.', (c, ...v) => map1(v.reduce((a, b) => map2(a, b, (x, y) => x + y)), x => x / v.length), true);
def('Maths', 'nz', [X, prm('value', 'num', { d:0 })], 'Replaces na with `value` (0 if left out).', (c, x, r) => map2(x, r, (a, b) => a !== a ? b : a));
def('Maths', 'na', [X], 'True where `x` has no value.', (c, x) => map1(x, v => +(v !== v)));

/* ---- output: plot, hline, input ---- */
// These record what the script asks for on the run context; the app does the drawing.
def('Output', 'plot', [prm('value', 'series'), prm('title', 'text', { d:'' }), prm('color', 'color', { d:null }), prm('width', 'scalar', { d:1 }),
  prm('style', 'word', { d:'line', of:['line', 'dashed', 'dotted', 'dots', 'histogram', 'area'] }), prm('pane', 'word', { d:'main', of:['main', 'below'] })],
  'Draws a series. `color` may differ bar by bar, e.g. `x > 0 ? green : red`. `style` is line, dashed, dotted, dots, histogram or area; dots suits signals that appear on single bars. `pane` is main (on the price chart) or below. Each plot needs its own `pane=below`: without it a plot goes on the price chart, even right after a plot that is below.',
  (c, value, title, color, width, style, pane) => {
    if (c.plots.length >= LIMITS.plots) c.fail(`a script can draw at most ${LIMITS.plots} plots and lines`);
    c.lastPane = pane;
    c.plots.push({ title:title.slice(0, 40), color: color || PALETTE[c.plots.filter(q => !q.hline).length % PALETTE.length], width:Math.min(4, Math.max(1, Math.round(width) || 1)), style, pane, hline:false, values:value });
    return value;
  });
def('Output', 'hline', [prm('value', 'scalar'), prm('title', 'text', { d:'' }), prm('color', 'color', { d:COLORS.gray }), prm('style', 'word', { d:'dashed', of:['line', 'dashed', 'dotted'] }), prm('pane', 'word', { d:null, of:['main', 'below'] })],
  'Draws a level line. It goes in the same pane as the plot before it unless `pane` says otherwise.',
  (c, value, title, color, style, pane) => {
    if (c.plots.length >= LIMITS.plots) c.fail(`a script can draw at most ${LIMITS.plots} plots and lines`);
    if (isS(color)) c.fail('the color of hline() must be a single colour');
    c.plots.push({ title:title.slice(0, 40), color, width:1, style, pane: pane || c.lastPane, hline:true, values:fill(c.n, value) });
    return value;
  });
def('Output', 'input', [prm('value', 'scalar'), prm('title', 'text', { d:'' }), prm('min', 'scalar', { d:null }), prm('max', 'scalar', { d:null }), prm('step', 'scalar', { d:null })],
  'A number the user can change without editing the script. `value` is the default.',
  (c, def_, title, min, max, step) => {
    if (!isFinite(def_)) c.fail('input() needs a number as its default');
    if (c.inputs.length >= LIMITS.inputs) c.fail(`a script can have at most ${LIMITS.inputs} inputs`);

    if (c.inputs.some(q => q.key === key)) c.fail(`two inputs are both called "${key}"; give each its own title`);
    let v = c.inputValues && has(c.inputValues, key) ? c.inputValues[key] : def_;
    if (typeof v !== 'number' || !isFinite(v)) v = def_;

/* ---- colours ---- */
// Turns a colour name or a #rgb / #rrggbb code into #rrggbb, or fails with a readable message.
function normColor(v, fail){
  if (v == null) return null;
  const s = String(v).trim().toLowerCase(); let m;

  if ((m = /^#([0-9a-f]{3})$/.exec(s))) return '#' + m[1].split('').map(ch => ch + ch).join('');
  if (/^#[0-9a-f]{6}$/.test(s)) return s;
  return fail(`"${String(v).slice(0, 30)}" is not a colour; use a name like red or a code like "#ff8800"`);
}

/* ============================================================================
   EVALUATOR - runs a parsed script against bars
   ============================================================================ */

function run(prog, bars, inputValues, opts){

  const lazy = {
    open: col('open'), high: col('high'), low: col('low'), close: col('close'),
    volume: () => bars.map(b => +b.volume || 0), time: () => bars.map(b => b.time), bar_index: () => bars.map((_, i) => i),
    hl2: () => S('high').map((h, i) => (h + S('low')[i]) / 2),
    hlc3: () => S('high').map((h, i) => (h + S('low')[i] + S('close')[i]) / 3),
    ohlc4: () => S('high').map((h, i) => (S('open')[i] + h + S('low')[i] + S('close')[i]) / 4),
    tr: () => trueRange(c),
    vwap: () => { // volume-weighted average price, restarting each session
      const key = (opts && opts.sessionKey) || (t => Math.floor(t / 86400)), h = S('high'), l = S('low'), cl = S('close'), vol = S('volume');
      let day, pv = 0, v = 0;
      return bars.map((b, i) => { const d = key(b.time); if (d !== day) { day = d; pv = 0; v = 0; } const tp = (h[i] + l[i] + cl[i]) / 3; pv += tp * vol[i]; v += vol[i]; return v ? pv / v : tp; });
    },

    spend(k){ work += k; if (work > LIMITS.work) fail('this script does too much work; try shorter lengths'); } };

  /* ---- checking and converting arguments ---- */
  const numeric = (v, what) => isStr(v) ? fail(`${what} needs numbers, not text or a colour`) : v;

  function coerce(v, q, f){

// Refresh path: bars[from..] are new or changed, everything before is untouched.
// Pushes just those points into the existing series instead of rebuilding them.
function updateTail(from){

  if (from > 0) { // the bar just before the change can only be redrawn by a rebuild, so check it still looks the same

/* ---- loading bars ---- */
async function load(fit = true){

  const my = ++loadToken, p = P(), s = sym(), key = curKey();
  writeHash();
  if (p.needsKey && !settings.tdKey) {
    bars = []; barsKey = ''; mainSeries.setData([]); clearIndicators(); updateLegend();
    overlay(`Stocks need a free Twelve Data key.<br><br><span style="color:var(--muted)">Open ⚙ Settings and paste it in. Meanwhile, switch the data source to Crypto or Demo to try things out.</span>`);
    setStatus('err', 'No API key'); return;
  }
  if (fit) { overlay(''); setStatus('busy', `Loading ${s}…`); userLoad = my; }
  try {
    const raw = await p.bars(s, state.tf, undefined, fit ? 'user' : 'refresh', () => my === loadToken), seen = new Map();
    raw.forEach(b => seen.set(b.time, b)); // drop duplicate timestamps, keep latest

    if (!fit && sameChart && bars.length) {

/* ---- older history (loads as you scroll back) ---- */
async function loadOlder(){

  olderBusy = true;
  const wasLive = $('statusText').textContent === 'Live';
  if (wasLive) setStatus('busy', 'Loading older bars…');
  try {
    const first = bars[0].time, seen = new Map();
    (await P().bars(sym(), state.tf, first, 'refresh', () => key === barsKey && key === curKey())).forEach(b => { if (b.time < first) seen.set(b.time, b); });

function renderWatch(){

    const bad = q && q.bad; if (bad) q = null;

  if (!only) { if (quoteRound[prov]) return; quoteRound[prov] = true; } // a round still waiting for credits: don't queue another behind it
  try {
    const q = await p.quotes(list), now = Date.now();
    for (const s in q) { quotedAt[prov+':'+s] = now; if (q[s]) quotes[prov+':'+s] = q[s]; else quotes[prov+':'+s] = { bad:true }; }
  } catch {}
  if (!only) quoteRound[prov] = false;
  if (prov === state.provider) renderWatch();
}
$('wl').addEventListener('click', e => {
  const x = e.target.closest('[data-x]');
  if (x) { e.stopPropagation(); watch[state.provider] = watch[state.provider].filter(s => s !== x.dataset.x); store.set('watch', watch); renderWatch(); return; }
  const r = e.target.closest('.row'); if (r) setSymbol(r.dataset.s);
});
function addWatch(){
  const v = $('wlAdd').value; if (!v.trim()) return;
  const s = P().norm(v); if (!watch[state.provider].includes(s)) watch[state.provider].push(s);
  store.set('watch', watch); $('wlAdd').value = ''; renderWatch(); refreshQuotes(s);
}
$('wlAddBtn').onclick = addWatch;
$('wlAdd').addEventListener('keydown', e => { if (e.key === 'Enter') addWatch(); });

/* ---- symbol and timeframe ---- */
function setSymbol(s){ symbols[state.provider] = s; $('symInput').value = s; saveState(); renderWatch(); applyLinesSafe(); load(true); }
function applyLinesSafe(){ try { applyLines(); } catch {} }
$('symInput').addEventListener('keydown', e => { if (e.key === 'Enter') { const s = P().norm(e.target.value); if (s) setSymbol(s); e.target.blur(); } });

function renderTfs(){
  const p = P(); if (!p.tfs.includes(state.tf)) state.tf = p.tfs.includes('1h') ? '1h' : p.tfs[0];
  $('tfGroup').innerHTML = p.tfs.map(t => `<button data-tf="${t}" class="${t===state.tf?'on':''}">${TF_LABELS[t]}</button>`).join('');
}
$('tfGroup').addEventListener('click', e => { const b = e.target.closest('[data-tf]'); if (!b) return; state.tf = b.dataset.tf; saveState(); renderTfs(); load(true); });

/* ---- chart type ---- */
$('chartType').value = state.type;
$('chartType').onchange = e => { state.type = e.target.value; saveState(); buildMain(); if (bars.length) render(false); };

/* ---- indicator menu ---- */
function renderIndMenu(){
  const builtIn = Object.entries(IND).map(([k,v]) => `<label><input type="checkbox" data-ind="${k}" ${state.ind[k]?'checked':''}><span class="sw" style="background:${v.color}"></span>${v.name}</label>`).join('');
  const list = !FX ? '<div class="note">The formula language did not load, so scripts are unavailable.</div>'
    : scripts.map(sc => `<label><input type="checkbox" data-script="${sc.id}" ${sc.on?'checked':''}><span class="nm">${esc(sc.name || 'Untitled')}</span>${sc.on && scriptInfo[sc.id] && scriptInfo[sc.id].err ? '<span class="warn" title="This script has an error">⚠</span>' : ''}<button class="mini" data-edit="${sc.id}" title="Edit script">✎</button></label>`).join('')
      + '<button class="btn new" id="newScript">+ New script</button>';
  $('indDrop').innerHTML = builtIn + '<div class="sep">Scripts</div>' + list;
}
function redrawIndicators(){ buildIndicators(); updateLegend(); }
renderIndMenu();
$('indDrop').addEventListener('change', e => {
  const k = e.target.dataset.ind, id = e.target.dataset.script;
  if (k) { state.ind[k] = e.target.checked; saveState(); redrawIndicators(); }
  else if (id) { const sc = scripts.find(x => x.id === id); if (!sc) return; sc.on = e.target.checked; saveScripts(); redrawIndicators(); if (edId === id) edRefresh(); }
});
$('indDrop').addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]');
  if (ed) { e.preventDefault(); openEditor(ed.dataset.edit); return; }
  if (e.target.id === 'newScript') {
    if (scripts.length >= MAX_SCRIPTS) return;
    const sc = { id:'s' + Date.now().toString(36), name:'My script', src:NEW_SCRIPT, on:true, inputs:{} };
    scripts.push(sc); saveScripts(); redrawIndicators(); openEditor(sc.id);
  }
});
$('indBtn').onclick = e => { e.stopPropagation(); renderIndMenu(); $('indMenu').classList.toggle('open'); };

/* ---- script editor: changes apply to the chart as you type ---- */
let edId = null, edTimer = null, edInputSig = null;
const edScript = () => scripts.find(x => x.id === edId);
function openEditor(id){
  if (edId) closeEditor();
  edId = id; const sc = edScript(); if (!sc) { edId = null; return; }
  $('indMenu').classList.remove('open');
  $('edName').value = sc.name; $('edSrc').value = sc.src; edInputSig = null; $('edInputs').innerHTML = '';
  $('editor').classList.add('show'); edRefresh(); $('edSrc').focus();
}
function closeEditor(){ if (edTimer) edApply(); edId = null; $('editor').classList.remove('show'); }
function edApply(){
  clearTimeout(edTimer); edTimer = null;
  const sc = edScript(); if (!sc) return;
  sc.name = $('edName').value.trim().slice(0, 40); sc.src = $('edSrc').value;
  saveScripts(); if (sc.on) redrawIndicators(); edRefresh();
}
function edQueue(){ clearTimeout(edTimer); edTimer = setTimeout(edApply, 350); }
function edRefresh(){
  const sc = edScript(); if (!sc) return;
  $('edOn').checked = sc.on;
  if (!sc.on || !bars.length) runScript(sc); // not drawn just now, so check it here
  const info = scriptInfo[sc.id] || {}, m = $('edMsg');
  m.className = 'ed-msg' + (info.err ? ' err' : sc.on ? '' : ' off');
  m.textContent = info.err || (sc.on ? `OK · drawing ${info.plots} series` : 'OK · hidden (tick Show to draw it)');
  if (!info.inputs) return; // keep the last good form while the script has an error
  const sig = JSON.stringify(info.inputs.map(q => [q.key, q.def, q.min, q.max, q.step]));
  if (sig === edInputSig) return;
  edInputSig = sig;
  const attr = (n, v) => typeof v === 'number' && isFinite(v) ? ` ${n}="${v}"` : '';
  $('edInputs').innerHTML = info.inputs.map(q => `<label>${esc(q.title)} <input type="number" data-key="${esc(q.key)}" value="${q.value}"${attr('min', q.min)}${attr('max', q.max)} step="${typeof q.step === 'number' && q.step > 0 ? q.step : 'any'}"></label>`).join('');
}
$('edSrc').addEventListener('input', edQueue);
$('edName').addEventListener('input', edQueue);
$('edSrc').addEventListener('keydown', e => {
  if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); e.target.setRangeText('  ', e.target.selectionStart, e.target.selectionEnd, 'end'); edQueue(); }
  else if (e.key === 'Escape') e.target.blur(); // so Tab can move on from the editor
});
$('edInputs').addEventListener('input', e => {
  const sc = edScript(), key = e.target.dataset.key; if (!sc || !key) return;
  const v = parseFloat(e.target.value);
  if (isFinite(v)) sc.inputs[key] = v; else delete sc.inputs[key]; // empty box goes back to the script's default
  saveScripts(); if (sc.on) redrawIndicators(); edRefresh();
});
$('edOn').onchange = e => { const sc = edScript(); if (!sc) return; if (edTimer) edApply(); sc.on = e.target.checked; saveScripts(); redrawIndicators(); edRefresh(); };
$('edClose').onclick = closeEditor;
$('edDelete').onclick = () => {
  const sc = edScript(); if (!sc || !confirm(`Delete "${sc.name || 'Untitled'}"? This cannot be undone.`)) return;
  clearTimeout(edTimer); edTimer = null;
  scripts = scripts.filter(x => x !== sc); compiled.delete(sc.id); delete scriptInfo[sc.id];
  saveScripts(); edId = null; $('editor').classList.remove('show'); redrawIndicators();
};
if (FX) {
  const groups = {}; FX.reference.forEach(r => (groups[r.group] = groups[r.group] || []).push(r));
  $('edRef').innerHTML = '<p>One statement per line: <code>name = expression</code>, or a call such as <code>plot(...)</code>. <code>//</code> starts a comment.</p>'
    + '<p><code>x[1]</code> is x one bar ago. <code>a ? b : c</code> picks b where a is true, otherwise c. Combine conditions with <code>and</code>, <code>or</code>, <code>not</code>. <code>na</code> means no value.</p>'
    + `<h4>Price series</h4><p><code>${esc(FX.series.join(', '))}</code></p>`
    + `<h4>Colours</h4><p><code>${esc(FX.colors.join(', '))}</code>, or a code such as <code>"#ff8800"</code></p>`
    + Object.entries(groups).map(([g, rs]) => `<h4>${esc(g)}</h4>` + rs.map(r => `<p><code>${esc(r.sig)}</code> ${esc(r.doc.replace(/`/g, ''))}</p>`).join('')).join('');
}
document.addEventListener('click', e => { if (!$('indMenu').contains(e.target)) $('indMenu').classList.remove('open'); });

/* ---- drawing price lines ---- */
$('hlineBtn').onclick = () => { hlineMode = !hlineMode; $('hlineBtn').classList.toggle('on', hlineMode); $('chart').style.cursor = hlineMode ? 'crosshair' : ''; };
chart.subscribeClick(param => {
  if (!hlineMode || !param.point || !mainSeries) return;
  const price = mainSeries.coordinateToPrice(param.point.y); if (price == null) return;
  const k = state.provider+':'+sym(); (lines[k] = lines[k] || []).push(+price.toPrecision(8)); store.set('lines', lines);
  applyLines(); hlineMode = false; $('hlineBtn').classList.remove('on'); $('chart').style.cursor = '';
});
$('clearLinesBtn').onclick = () => { delete lines[state.provider+':'+sym()]; store.set('lines', lines); applyLines(); };

/* ---- data source picker ---- */
$('providerSel').innerHTML = Object.entries(providers).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join('');
$('providerSel').value = state.provider;
$('providerSel').onchange = e => { state.provider = e.target.value; saveState(); switchProvider(); };
function switchProvider(){
  $('symInput').value = sym(); $('delayNote').textContent = P().delay; $('updated').textContent = ''; tdDayShow();
  renderTfs(); renderWatch(); schedule(); applyLinesSafe(); load(true); refreshQuotes();
}

/* ---- settings ---- */
$('settingsBtn').onclick = () => { $('tdKey').value = settings.tdKey; $('refreshSel').value = settings.refresh; $('settings').classList.add('show'); };
$('settingsCancel').onclick = () => $('settings').classList.remove('show');
$('settings').addEventListener('click', e => { if (e.target.id === 'settings') $('settings').classList.remove('show'); });
$('settingsSave').onclick = () => {
  const newKey = $('tdKey').value.trim();
  if (newKey !== settings.tdKey) { tdSave([]); tdDayMem = null; store.set('tdDay', null); } // a different key has its own budget
  settings.tdKey = newKey; settings.refresh = $('refreshSel').value; store.set('settings', settings);
  $('settings').classList.remove('show'); tdDayShow(); schedule(); load(true); refreshQuotes();
};

/* ---- keyboard and page events ---- */
// type anywhere to jump to the symbol box
document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') { hlineMode = false; $('hlineBtn').classList.remove('on'); $('chart').style.cursor=''; $('settings').classList.remove('show'); return; }
  if (/^[a-z0-9]$/i.test(e.key)) { $('symInput').value = ''; $('symInput').focus(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(false); refreshQuotes(); } });
window.addEventListener('hashchange', () => { if (readHash()) { saveState(); $('providerSel').value = state.provider; switchProvider(); } });

/* ============================================================================
   START - build the chart and load the first data
   ============================================================================ */
buildMain();
switchProvider();
})();
</script>
</body>
</html>
